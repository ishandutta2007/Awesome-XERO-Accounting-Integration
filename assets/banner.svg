<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 340"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a192f"/><stop offset="50%" stop-color="#0b2545"/><stop offset="100%" stop-color="#134074"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00b4d8"/><stop offset="50%" stop-color="#13b5ea"/><stop offset="100%" stop-color="#90e0ef"/></linearGradient><linearGradient id="secondaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="nodeGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.08)}}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:400;font-size:19px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#0284c7}.grid-line{stroke:rgba(255,255,255,.04);stroke-width:1}.flow-line{fill:none;stroke:url(#primaryGrad);stroke-width:2.5;stroke-dasharray:8 6;opacity:.6;animation:dash 25s linear infinite}.flow-line-reverse{fill:none;stroke:url(#secondaryGrad);stroke-width:2;stroke-dasharray:6 6;opacity:.45;animation:dashReverse 30s linear infinite}.data-packet{fill:#00f2fe;filter:url(#nodeGlow)}.pill{fill:rgba(15,23,42,.65);stroke:rgba(56,189,248,.35);stroke-width:1.5;rx:16px}.pill-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif;font-weight:500;font-size:13px;fill:#e2e8f0}.floating-card{animation:float 6s ease-in-out infinite}.floating-card-2{animation:float 8s ease-in-out infinite reverse}</style><rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/><g><line x1="0" x2="1200" y1="60" y2="60" class="grid-line"/><line x1="0" x2="1200" y1="120" y2="120" class="grid-line"/><line x1="0" x2="1200" y1="180" y2="180" class="grid-line"/><line x1="0" x2="1200" y1="240" y2="240" class="grid-line"/><line x1="0" x2="1200" y1="300" y2="300" class="grid-line"/><line x1="200" x2="200" y1="0" y2="340" class="grid-line"/><line x1="400" x2="400" y1="0" y2="340" class="grid-line"/><line x1="600" x2="600" y1="0" y2="340" class="grid-line"/><line x1="800" x2="800" y1="0" y2="340" class="grid-line"/><line x1="1000" x2="1000" y1="0" y2="340" class="grid-line"/></g><circle cx="980" cy="110" r="130" fill="#0284c7" filter="url(#glow)" opacity=".16"><animate attributeName="r" dur="9s" repeatCount="indefinite" values="120;140;120"/></circle><circle cx="150" cy="270" r="90" fill="#6366f1" filter="url(#glow)" opacity=".14"><animate attributeName="r" dur="7s" repeatCount="indefinite" values="80;105;80"/></circle><g><path d="M -50 250 C 250 290, 450 180, 750 230 S 1050 170, 1250 190" class="flow-line"/><path d="M -50 110 C 280 60, 520 180, 800 100 S 1080 150, 1250 80" class="flow-line-reverse"/><circle r="4" class="data-packet"><animateMotion dur="10s" path="M -50 250 C 250 290, 450 180, 750 230 S 1050 170, 1250 190" repeatCount="indefinite"/></circle><circle r="3.5" fill="#a5f3fc" class="data-packet"><animateMotion begin="5s" dur="10s" path="M -50 250 C 250 290, 450 180, 750 230 S 1050 170, 1250 190" repeatCount="indefinite"/></circle><circle r="4" fill="#c084fc" class="data-packet"><animateMotion dur="12s" path="M 1250 80 C 1080 150, 800 100, 520 180 S 280 60, -50 110" repeatCount="indefinite"/></circle></g><g class="floating-card" transform="translate(860, 55)"><rect width="270" height="95" fill="#0f172a" fill-opacity=".82" stroke="#1e293b" stroke-width="1.5" rx="14"/><circle cx="36" cy="36" r="16" fill="#13b5ea" fill-opacity=".2"/><text x="36" y="42" fill="#13b5ea" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" text-anchor="middle">X</text><text x="64" y="34" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Xero Ecosystem</text><text x="64" y="52" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">Accounting &amp; Invoices</text><path fill="none" stroke="#00b4d8" stroke-width="2.5" d="M 30 75 Q 80 65, 120 73 T 180 68 T 240 74"/><circle cx="240" cy="74" r="3.5" fill="#38bdf8" filter="url(#nodeGlow)"/></g><g class="floating-card-2" transform="translate(890, 175)"><rect width="250" height="95" fill="#0f172a" fill-opacity=".82" stroke="#1e293b" stroke-width="1.5" rx="14"/><circle cx="36" cy="36" r="16" fill="#10b981" fill-opacity=".2"/><text x="36" y="42" fill="#10b981" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" text-anchor="middle">⇄</text><text x="64" y="34" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Bi-Directional Sync</text><text x="64" y="52" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">SaaS + Open Source Tools</text><rect width="130" height="6" x="30" y="72" fill="#1e293b" rx="3"/><rect width="95" height="6" x="30" y="72" fill="#10b981" rx="3"/><rect width="50" height="6" x="175" y="72" fill="#6366f1" rx="3"/></g><g><g transform="translate(70, 0) translate(0, 52)"><rect width="225" height="30" fill="#0369a1" fill-opacity=".25" stroke="#0284c7" stroke-width="1.2" rx="15"/><circle cx="16" cy="15" r="4.5" fill="#38bdf8"/><text x="28" y="20" fill="#38bdf8" class="badge-text">FINTECH &amp; ACCOUNTING</text></g><text x="0" y="132" class="title" transform="transla