<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0b2545" />
      <stop offset="100%" stop-color="#134074" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#13b5ea" />
      <stop offset="100%" stop-color="#90e0ef" />
    </linearGradient>

    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #0284c7;
    }
    .grid-line {
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 1;
    }
    .flow-line {
      fill: none;
      stroke: url(#primaryGrad);
      stroke-width: 2.5;
      stroke-dasharray: 8 6;
      opacity: 0.6;
      animation: dash 25s linear infinite;
    }
    .flow-line-reverse {
      fill: none;
      stroke: url(#secondaryGrad);
      stroke-width: 2;
      stroke-dasharray: 6 6;
      opacity: 0.45;
      animation: dashReverse 30s linear infinite;
    }
    .data-packet {
      fill: #00f2fe;
      filter: url(#nodeGlow);
    }
    .pill {
      fill: rgba(15, 23, 42, 0.65);
      stroke: rgba(56, 189, 248, 0.35);
      stroke-width: 1.5;
      rx: 16px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #e2e8f0;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    @keyframes dashReverse {
      to {
        stroke-dashoffset: 1000;
      }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    .floating-card {
      animation: float 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: float 8s ease-in-out infinite reverse;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Lines -->
  <g>
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="340" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="340" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="340" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="340" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="340" class="grid-line" />
  </g>

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle cx="980" cy="110" r="130" fill="#0284c7" opacity="0.16" filter="url(#glow)">
    <animate attributeName="r" values="120;140;120" dur="9s" repeatCount="indefinite" />
  </circle>
  <circle cx="150" cy="270" r="90" fill="#6366f1" opacity="0.14" filter="url(#glow)">
    <animate attributeName="r" values="80;105;80" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Animated Data Flows / Wave Lines (Background Layer) -->
  <g>
    <path class="flow-line" d="M -50 250 C 250 290, 450 180, 750 230 S 1050 170, 1250 190" />
    <path class="flow-line-reverse" d="M -50 110 C 280 60, 520 180, 800 100 S 1080 150, 1250 80" />
    
    <!-- Moving Packets along the lines -->
    <circle r="4" class="data-packet">
      <animateMotion path="M -50 250 C 250 290, 450 180, 750 230 S 1050 170, 1250 190" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" class="data-packet" fill="#a5f3fc">
      <animateMotion path="M -50 250 C 250 290, 450 180, 750 230 S 1050 170, 1250 190" dur="10s" begin="5s" repeatCount="indefinite" />
    </circle>
    <circle r="4" class="data-packet" fill="#c084fc">
      <animateMotion path="M 1250 80 C 1080 150, 800 100, 520 180 S 280 60, -50 110" dur="12s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Interactive Graphic Accent Cards on Right (Floating / Animated) -->
  <g class="floating-card" transform="translate(860, 55)">
    <rect width="270" height="95" rx="14" fill="#0f172a" fill-opacity="0.82" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="36" cy="36" r="16" fill="#13b5ea" fill-opacity="0.2" />
    <!-- Xero Inspired Icon -->
    <text x="36" y="42" font-family="-apple-system, sans-serif" font-weight="900" font-size="16" fill="#13b5ea" text-anchor="middle">X</text>
    <text x="64" y="34" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" fill="#f8fafc">Xero Ecosystem</text>
    <text x="64" y="52" font-family="-apple-system, sans-serif" font-weight="500" font-size="12" fill="#64748b">Accounting &amp; Invoices</text>
    <!-- Mini Pulse Chart -->
    <path d="M 30 75 Q 80 65, 120 73 T 180 68 T 240 74" fill="none" stroke="#00b4d8" stroke-width="2.5" />
    <circle cx="240" cy="74" r="3.5" fill="#38bdf8" filter="url(#nodeGlow)" />
  </g>

  <g class="floating-card-2" transform="translate(890, 175)">
    <rect width="250" height="95" rx="14" fill="#0f172a" fill-opacity="0.82" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="36" cy="36" r="16" fill="#10b981" fill-opacity="0.2" />
    <text x="36" y="42" font-family="-apple-system, sans-serif" font-weight="900" font-size="14" fill="#10b981" text-anchor="middle">⇄</text>
    <text x="64" y="34" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" fill="#f8fafc">Bi-Directional Sync</text>
    <text x="64" y="52" font-family="-apple-system, sans-serif" font-weight="500" font-size="12" fill="#64748b">SaaS + Open Source Tools</text>
    <!-- Mini Progress Bars -->
    <rect x="30" y="72" width="130" height="6" rx="3" fill="#1e293b" />
    <rect x="30" y="72" width="95" height="6" rx="3" fill="#10b981" />
    <rect x="175" y="72" width="50" height="6" rx="3" fill="#6366f1" />
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle Always in Crisp Foreground -->
  <g transform="translate(70, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 52)">
      <rect width="225" height="30" rx="15" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4.5" fill="#38bdf8" />
      <text x="28" y="20" class="badge-text" fill="#38bdf8">FINTECH &amp; ACCOUNTING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title">
      Awesome <tspan fill="url(#primaryGrad)">Xero Accounting</tspan>
    </text>
    <text x="0" y="174" class="title" font-size="34" fill="#f1f5f9">
      Integrations &amp; Open Source Tools
    </text>

    <!-- Subtitle -->
    <text x="0" y="218" class="subtitle">
      A curated collection of SaaS pipelines, SDKs, ETL connectors, and self-hosted engines.
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 252)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="34" class="pill" />
        <text x="67" y="22" class="pill-text" text-anchor="middle">⚡ Real-time Sync</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(147, 0)">
        <rect width="130" height="34" class="pill" />
        <text x="65" y="22" class="pill-text" text-anchor="middle">🌐 Cloud iPaaS</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(289, 0)">
        <rect width="145" height="34" class="pill" />
        <text x="72" y="22" class="pill-text" text-anchor="middle">🔓 Open Source</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(446, 0)">
        <rect width="130" height="34" class="pill" />
        <text x="65" y="22" class="pill-text" text-anchor="middle">📊 Data Warehouses</text>
      </g>
    </g>
  </g>
</svg>
